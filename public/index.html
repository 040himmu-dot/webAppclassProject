<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Bank System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- The background image is handled in CSS -->
    <div class="overlay"></div>

    <main class="login-container">
        <div class="login-card">
            <header class="card-header">
                <!-- Replace with your actual logo -->
                <img src="Food-Bank-Icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                <h1>FOOD BANK</h1>
                <p>MANAGEMENT PORTAL</p>
            </header>

            <form action="/api/login" method="POST" class="minimal-form">
                <div class="input-wrapper">
                    <input type="email" name="username" placeholder="EMAIL ADDRESS" required>
                </div>
                <div class="input-wrapper">
                    <input type="password" name="password" placeholder="PASSWORD" required>
                </div>
                <button type="submit" class="btn-primary">SIGN IN</button>
            </form>

            <footer class="card-footer">
                <p><strong>TEST ACCOUNTS (PASS123)</strong></p>
                <p>admin | donor | volunteer | recipient</p>
            </footer>
        </div>
    </main>
</body>
</html>
