<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - Food Bank</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 30px; }
        .card { max-width: 800px; margin: 0 auto 20px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #2c3e50; }
        label { font-weight: bold; margin-right: 6px; }
        select, input { padding: 8px; margin: 6px 14px 6px 0; }
        button { background: #27ae60; color: #fff; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #eef7f2; }
        a { color: #27ae60; }
        #msg { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <p><a href="/">&larr; Back to dashboard</a></p>
        <h2>Monthly / Yearly Reports</h2>
        <label>Report</label>
        <select id="type">
            <option value="donation">Donation &amp; Distribution Summary</option>
            <option value="waste">Inventory Waste Summary</option>
        </select>
        <label>Period</label>
        <select id="period" onchange="togglePeriod()">
            <option value="month">Monthly</option>
            <option value="year">Yearly</option>
        </select>
        <label>Year</label>
        <input type="number" id="year" value="2026" min="2000" max="2100" style="width:90px">
        <span id="monthBox">
            <label>Month</label>
            <select id="month">
                <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                <option value="10" selected>October</option><option value="11">November</option><option value="12">December</option>
            </select>
        </span>
        <button onclick="generate()">Generate</button>
        <p id="msg"></p>
    </div>
    <div class="card" id="result" style="display:none"></div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user') || 'null');
        // TODO: re-enable once login tells the page who is logged in (Aakrosh)
        // if (!user || user.role !== 'Coordinator') { window.location.href = '/'; }

        function togglePeriod() {
            document.getElementById('monthBox').style.display =
                document.getElementById('period').value === 'month' ? 'inline' : 'none';
        }
        // prevents names from being interpreted as HTML
        function esc(s) {
            const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }
        function table(headers, rows) {
            if (rows.length === 0) return '<p><em>No data for this period.</em></p>';
            return '<table><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr>' +
                rows.map(r => '<tr>' + r.map(c => '<td>' + esc(String(c)) + '</td>').join('') + '</tr>').join('') +
                '</table>';
        }

        async function generate() {
            const msg = document.getElementById('msg'); msg.innerText = '';
            const type = document.getElementById('type').value;
            const year = document.getElementById('year').value;
            let url = `/api/reports?type=${type}&year=${year}`;
            if (document.getElementById('period').value === 'month') {
                url += '&month=' + document.getElementById('month').value;
            }
            const res = await fetch(url, { headers: user ? { 'x-user-id': user.userID } : {} });
            const data = await res.json();
            if (!data.success) { msg.innerText = data.message; return; }

            const d = data.data;
            let html = `<h3>${type === 'donation' ? 'Donation &amp; Distribution Summary' : 'Inventory Waste Summary'}</h3>` +
                       `<p>Period: ${d.period.start} to ${d.period.end}</p>`;
            if (type === 'donation') {
                html += '<h4>Total donations received by category</h4>' +
                        table(['Category', 'Total quantity'], d.donations.map(r => [r.category, r.total]));
                html += `<h4>Total hampers distributed: ${d.hampersDistributed}</h4>`;
                html += '<h4>Missed / delayed pickups per recipient</h4>' +
                        table(['Recipient', 'Missed', 'Delayed'], d.pickups.map(r => [r.name, r.missed, r.delayed]));
            } else {
                html += '<h4>Expired / wasted items by category</h4>' +
                        table(['Category', 'Total wasted'], d.waste.map(r => [r.category, r.total]));
            }
            const box = document.getElementById('result');
            box.innerHTML = html; box.style.display = 'block';
        }
        togglePeriod();
    </script>
</body>
</html>
